        type: string
      - name: key
        in: path
        required: true
        type: string
    get:
      operationId: GET_store-id-variant-key
      tags:
        - Store
      description: >-
        It is possible to access the product variants organized under a store by

        providing the store's unique identifier and the variant's unique key. As
        with

        all calls, this requires an API key included along with the request.
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/GetAStoresVariantResponse'
    patch:
      operationId: PATCH_store-id-variant-key
      tags:
        - Store
      description: >-
        The PATCH method will allow you to replace a given ID's data in a
        piecemeal

        fashion.  Any fields passed in to a PATCH method will be updated with
        what you

        request, while any fields not specified in the JSON will be left alone.
      responses:
        '200':
          description: ''
    delete:
      operationId: DELETE_store-id-variant-key
      tags:
        - Store
      description: >-
        Deleting a Variant is as simple as passing its ID to the Variant
        endpoint using

        the HTTP Delete method. You will not receive a response past the normal
        HTTP

        200.
      responses:
        '200':
          description: ''
    put:
      operationId: PUT_store-id-variant-key
      tags:
        - Store
      description: >-
        The PUT method will allow you to replace a given ID's data in its
        entirety.

        Passing in valid Variant JSON (see the POST method), will overwrite any
        and all

        data existing on that ID.
      responses:
        '200':
          description: ''
