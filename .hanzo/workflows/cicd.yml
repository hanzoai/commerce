name: CI/CD
# The ONE pipeline for commerce, now where it belongs: on our own runners,
# against git.hanzo.ai. Same ~7-line caller it has always been — every real
# detail (4 images, 3 test gates, no deploy block) lives in the repo-root
# `hanzo.yml`, which platform.hanzo.ai reads too. Moving the file did not move
# any build logic, because there is none here to move.
#
# It absorbed the two bespoke GitHub workflows that ran beside it:
#   frontend-build.yml → hanzo.yml `images:` (commerce-store was the one image
#     it built that hanzo.yml lacked; it also re-pushed fixed semver + :latest
#     tags on every push, which the shared builder does not do)
#   test.yml          → hanzo.yml `test:` (go-vet + go-unit were already
#     duplicated there; the ginkgo API suites were not)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    with:
      # Pin the pool as a JSON *string*, not the reusable's default JSON *array*.
      # git.hanzo.ai evaluates `runs-on` by STRING interpolation — one Interpolate
      # per entry, modules/actions/jobparser/jobparser.go:67-70 — so the default
      #   runs-on: ${{ fromJson(inputs.runner) }}   # inputs.runner = '["..."]'
      # renders an array as the literal label "Array", no runner ever matches, and
      # the job sits queued forever (run 1688 did exactly that). GitHub evaluates
      # the same expression structurally, which is why it only breaks on the forge.
      # fromJson('"x"') is the string "x" under BOTH engines, and one label is all
      # the <org>-<os>-<arch> pool scheme ever needs.
      # This is a repo-local unblock, NOT the fix: array-valued runs-on belongs in
      # hanzo-git's jobparser (or the shape belongs in hanzoai/ci, whose other 8
      # callers — incl. hanzoai/node, which passes the array form explicitly — are
      # still on GitHub Actions where it works). hanzoai/cloud is the other repo
      # already cut over to .hanzo/workflows, and it has built NOTHING since.
      runner: '"hanzo-build-linux-amd64"'
    secrets: inherit
