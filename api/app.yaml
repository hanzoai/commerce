application: crowdstart-us
module: api
version: v1

runtime: go
api_version: go1
threadsafe: true

instance_class: F1

automatic_scaling:
  max_concurrent_requests: 100
  min_idle_instances: 0
  max_idle_instances: automatic
  min_pending_latency: 30ms
  max_pending_latency: automatic

handlers:
- url: /.*
  script: _go_app
  secure: always
