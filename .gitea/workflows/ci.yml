# Native CI for the Hanzo Git act_runners (label hanzo-build-linux-amd64).
# Self-contained on purpose — no reusable-workflow hub (hanzoai/ci) is on Gitea
# yet. GitHub.com ignores .gitea/workflows, so this never touches the GitHub
# release lanes; it mirrors the proven steps of .github/workflows/test.yml.
#
# Secrets: UNIVERSE_PAT (private hanzoai/* module fetch) is a Gitea Actions
# repo/org secret — already seeded for this repo. GITHUB_TOKEN is auto-minted
# per job by Gitea, scoped to the Gitea instance.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: hanzo-build-linux-amd64
    env:
      # hanzoai/* are private → direct git, skip proxy/sumdb. zap-proto/* and
      # luxfi/* are public. GOWORK=off avoids the stale committed go.work.sum.
      GOPRIVATE: github.com/hanzoai/*
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod
      - name: Private modules
        env:
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: git config --global url."https://x-access-token:${UNIVERSE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Plans
        # api/billing/plans/ is gitignored (@hanzo/plans is the SOT); plans.go
        # go:embed's it, so this MUST run before the compiler sees the package.
        run: sh scripts/fetch-plans.sh
      - run: go build ./...
      - run: go vet ./...

  test:
    runs-on: hanzo-build-linux-amd64
    needs: [build]
    env:
      CGO_ENABLED: "1"
      GOPRIVATE: github.com/hanzoai/*
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod
      - name: Private modules
        env:
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: git config --global url."https://x-access-token:${UNIVERSE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Plans
        run: sh scripts/fetch-plans.sh
      - name: Unit
        run: |
          go test -v -count=1 -timeout=10m \
            ./billing/... \
            ./delay/... \
            ./models/creditgrant/... \
            ./models/pricingrule/... \
            ./models/cryptobalance/... \
            ./models/cryptopaymentintent/... \
            ./models/networktoken/... \
            ./models/product/... \
            ./payment/...
      - name: Suites
        # Pinned ginkgo (go.mod) via `go run`; skip the integration package that
        # needs external services the runner does not provide.
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -r --randomize-all --fail-fast --trace \
            --skip-package=test-integration \
            test/
