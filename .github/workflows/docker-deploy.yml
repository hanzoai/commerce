name: Docker Release

on:
  # Semver-only publishing: ONLY a v* git tag produces a published image
  # (ghcr.io/hanzoai/commerce:X.Y.Z). No branch builds — those emitted
  # sha-<sha>/floating drift and redundant queued runs. Deploys pin vX.Y.Z.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/commerce
      # amd64-only: arm64 is PAUSED (DOKS has no arm64 droplets). Building
      # both emitted per-arch -amd64/-arm64 tag drift; amd64 is the canonical
      # DOKS build path. Re-add linux/arm64 when DO ships arm64 instances.
      platforms: linux/amd64
      # @hanzo/plans is the data SOT on npm — public package. The
      # pre-build pulls the tarball into api/billing/plans/ so Go's
      # go:embed bakes the canonical catalog into the binary at
      # compile time. No auth needed.
      pre-build-command: "sh scripts/fetch-plans.sh"
      # On a v* tag push, inject the git tag as commerce.Version via
      # -ldflags so /healthz version == image tag. The Dockerfile strips the
      # leading "v" (GHA has no replace()). Branch builds leave it empty →
      # in-source default holds.
      build-args: |
        VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    secrets: inherit
