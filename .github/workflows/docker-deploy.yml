name: Docker Release

on:
  push:
    branches: [main, test, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/commerce
      platforms: linux/amd64
    secrets: inherit
