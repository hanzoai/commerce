name: Docker Release

on:
  push:
    branches: [main, test, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/commerce
      # Native multi-arch. amd64 → hanzo-build-linux-amd64 (DOKS ARC).
      # arm64 → spark (Ampere bare metal arcd). No QEMU.
      platforms: linux/amd64,linux/arm64
      # hanzoai/plans is the data SOT. Clone it into api/billing/plans/
      # before docker build so go:embed picks up the canonical catalog
      # at compile time. GITHUB_TOKEN has read on the private plans
      # repo in-org.
      pre-build-command: "GITHUB_TOKEN=$GITHUB_TOKEN sh scripts/fetch-plans.sh"
    secrets: inherit
