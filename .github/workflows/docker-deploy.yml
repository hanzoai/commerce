name: Docker Release

on:
  push:
    branches: [main, test, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/commerce
      # Native multi-arch. amd64 → hanzo-build-linux-amd64 (DOKS ARC).
      # arm64 → spark (Ampere bare metal arcd). No QEMU.
      platforms: linux/amd64,linux/arm64
      # @hanzo/plans is the data SOT on npm — public package. The
      # pre-build pulls the tarball into api/billing/plans/ so Go's
      # go:embed bakes the canonical catalog into the binary at
      # compile time. No auth needed.
      pre-build-command: "sh scripts/fetch-plans.sh"
    secrets: inherit
