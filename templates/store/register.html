{% extends "base.html" %}

{% block content_header %}
<h1>Register</h1>
{% endblock %}

{% block css %}
<style>
    div.field {
        display: block;
    }
    div.error {
        text-color: red;
    }
</style>
{% endblock %}

{% block cart_hover %}
<!-- CART HOVER DISABLED -->
{% endblock %}

{% block content %}
<div class="register">
    <form action="{{ urlFor("store", "/register") }}" method="post">
        <div class="form">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="text" name="User.Email" placeholder="email address">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="Password" placeholder="&bull;&bull;&bull;">
            </div>
            <div class="field">
                <label for="passwordConfirm">Confirm password</label>
                <input id="passwordConfirm" type="password" name="PasswordConfirm" placeholder="&bull;&bull;&bull;">
            </div>
            <div class="error">{{ error }}</div>
            <div>
                <button type="submit">Register</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block js %}
{% if isProduction %}
<!-- Facebook Conversion Code for Registrations -->
<script>
window._fbq = window._fbq || [];
window._fbq.push(['track', '6027472475717', {'value':'0.00','currency':'USD'}]);
</script>
<noscript><img height="1" width="1" alt="" style="display:none" src="https://www.facebook.com/tr?ev=6027472475717&amp;cd[value]=0.00&amp;cd[currency]=USD&amp;noscript=1" /></noscript>
{% endif %}
{% endblock %}
